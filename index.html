    <script src="db.js"></script>
    <script src="data.js"></script>
    <script>
      var DB = Store.load();
      var GROUPS = DB.groups,
        PLACES = DB.places;
      var DATA = DB.items.filter(function (d) {
        return GROUPS.some(function (g) {
          return g.id === d.group;
        });
      });
      DATA.forEach(function (d) {
        d.hue = GROUPS.filter(function (g) {
          return g.id === d.group;
        })[0].hue;
        d.date = d.year * 100 + d.month;
      });

      var S = { q: "", group: null, member: null, year: {}, place: {}, chars: {}, sort: "new" };
      var $ = function (id) {
        return document.getElementById(id);
      };
      function gname(id) {
        return GROUPS.filter(function (g) {
          return g.id === id;
        })[0].name;
      }
      function gobj(id) {
        return GROUPS.filter(function (g) {
          return g.id === id;
        })[0];
      }
      function mname(d) {
        if (!d.member) return "";
        var g = gobj(d.group);
        if (d.member === "all") return g.name + "全團";
        var m = (g.members || []).filter(function (m) {
          return m.id === d.member;
        })[0];
        return m ? m.name : "";
      }
      function setGroup(id) {
        S.group = id;
        S.member = null;
        buildChips();
        render();
      }
      function buildMembers() {
        var box = $("members"),
          g = S.group && gobj(S.group);
        if (!g || !g.members || !g.members.length) {
          box.style.display = "none";
          box.innerHTML = "";
          return;
        }
        box.style.display = "";
        box.innerHTML = '<span style="align-self:center;color:var(--muted);font-size:14px">角色</span>';
        [{ id: "all", name: g.name + "全團", color: "hsl(" + g.hue + " 80% 55%)" }]
          .concat(g.members)
          .forEach(function (m) {
            var n = DATA.filter(function (d) {
              return d.group === g.id && d.member === m.id;
            }).length;
            var b = document.createElement("button");
            b.type = "button";
            b.className = "chip";
            b.setAttribute("aria-pressed", S.member === m.id);
            b.innerHTML =
              '<i style="background:' + m.color + '"></i>' + esc(m.name) + " <small>" + n + "</small>";
            b.onclick = function () {
              S.member = S.member === m.id ? null : m.id;
              buildMembers();
              render();
            };
            box.appendChild(b);
          });
      }

      var T = null,
        ADV_SHORT = { "TOGENASHI TOGEARI": "TOGENASHI" };
      function cp(o) {
        var r = {};
        for (var k in o) r[k] = 1;
        return r;
      }
      function charGroups() {
        return GROUPS.filter(function (g) {
          return g.members && g.members.length;
        });
      }
      function allCharKeys() {
        var ks = [];
        charGroups().forEach(function (g) {
          ks.push(g.id + ":all");
          g.members.forEach(function (m) {
            ks.push(g.id + ":" + m.id);
          });
        });
        return ks;
      }
      function shortName(n) {
        return n
          .replace(/^「[^」]*」/, "")
          .split("／")[0]
          .trim();
      }
      function buildFilters() {
        var n = Object.keys(S.chars).filter(function (k) {
          return !/:all$/.test(k);
        }).length;
        var b = $("adv-n");
        b.hidden = !n;
        b.textContent = n;
        if ($("advdlg").open) buildAdv();
      }
      function ck(on) {
        return '<i class="ck' + (on ? " on" : "") + '"></i>';
      }
      function buildAdv() {
        var html = "";
        charGroups().forEach(function (g) {
          var tiles = g.members;
          var keys = [g.id + ":all"].concat(
            tiles.map(function (m) {
              return g.id + ":" + m.id;
            }),
          );
          var allOn = keys.every(function (k) {
            return T.chars[k];
          });
          html +=
            '<div class="adv-row"><div class="adv-g"><b>' +
            (g.icon
              ? '<img class="adv-gi" src="' +
                esc(g.icon) +
                '" alt="" height="18" style="height:18px;width:auto;max-width:40px">'
              : "") +
            '<span title="' +
            esc(g.name) +
            '">' +
            esc(ADV_SHORT[g.name] || g.name) +
            '</span></b><button type="button" class="adv-sel" data-gall="' +
            g.id +
            '">' +
            ck(allOn) +
            '全選</button></div><div class="adv-ms">';
          tiles.forEach(function (m) {
            var k = g.id + ":" + m.id,
              on = !!T.chars[k],
              n = DATA.filter(function (d) {
                return d.group === g.id && d.member === m.id;
              }).length;
            var av = m.avatar
              ? '<img src="' +
                esc(m.avatar) +
                '" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode(\'' +
                esc(shortName(m.name)).charAt(0) +
                "'))\">"
              : esc(shortName(m.name).charAt(0));
            html +=
              '<button type="button" class="adv-m' +
              (on ? " on" : "") +
              (n ? "" : " zero") +
              '" data-k="' +
              esc(k) +
              '" aria-pressed="' +
              on +
              '" title="' +
              esc(m.name) +
              "（" +
              n +
              ' 件）">' +
              ck(on) +
              '<span class="av' +
              (m.avatar ? " img" : "") +
              '" style="--c:' +
              esc(m.color) +
              '">' +
              av +
              '</span><span class="nm">' +
              esc(shortName(m.name)) +
              "</span></button>";
          });
          html += "</div></div>";
        });
        $("adv-chars").innerHTML = html || '<p class="adv-empty">尚未設定團員，可到後台新增</p>';
        var ks = allCharKeys();
        $("adv-all").innerHTML =
          ck(
            ks.length &&
              ks.every(function (k) {
                return T.chars[k];
              }),
          ) + "全員選擇";
      }
      $("adv").onclick = function () {
        T = { chars: cp(S.chars), year: cp(S.year), place: cp(S.place) };
        buildAdv();
        $("advdlg").showModal();
      };
      $("advdlg").addEventListener("click", function (e) {
        if (e.target === this) {
          this.close();
          return;
        }
        var t = e.target.closest("button");
        if (!t) return;
        if (t.dataset.k) {
          var k = t.dataset.k;
          if (T.chars[k]) delete T.chars[k];
          else T.chars[k] = 1;
          var gid = k.split(":")[0],
            gg = GROUPS.filter(function (x) {
              return x.id === gid;
            })[0];
          if (
            gg.members.every(function (m) {
              return T.chars[gid + ":" + m.id];
            })
          )
            T.chars[gid + ":all"] = 1;
          else delete T.chars[gid + ":all"];
        } else if (t.dataset.gall) {
          var g = GROUPS.filter(function (x) {
              return x.id === t.dataset.gall;
            })[0],
            ks = [g.id + ":all"].concat(
              g.members.map(function (m) {
                return g.id + ":" + m.id;
              }),
            );
          var on = ks.every(function (k) {
            return T.chars[k];
          });
          ks.forEach(function (k) {
            if (on) delete T.chars[k];
            else T.chars[k] = 1;
          });
        } else if (t.id === "adv-all") {
          var ks = allCharKeys(),
            on = ks.every(function (k) {
              return T.chars[k];
            });
          ks.forEach(function (k) {
            if (on) delete T.chars[k];
            else T.chars[k] = 1;
          });
        } else if (t.id === "adv-reset") {
          T = { chars: {}, year: {}, place: {} };
        } else if (t.id === "adv-cancel") {
          this.close();
          return;
        } else if (t.id === "adv-ok") {
          var ks = allCharKeys();
          if (
            ks.length &&
            ks.every(function (k) {
              return T.chars[k];
            })
          )
            T.chars = {};
          S.chars = T.chars;
          S.year = T.year;
          S.place = T.place;
          this.close();
          buildFilters();
          render();
          return;
        } else return;
        buildAdv();
      });
      function buildChips() {
        var box = $("chips");
        box.innerHTML = "";
        GROUPS.forEach(function (g) {
          var n = DATA.filter(function (d) {
            return d.group === g.id;
          }).length;
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.setAttribute("aria-pressed", S.group === g.id);
          b.innerHTML =
            (g.icon
              ? '<img class="chip-icon" src="' + esc(g.icon) + '" alt="">'
              : '<i style="background:hsl(' + g.hue + ' 80% 55%)"></i>') +
            esc(g.name) +
            " <small>" +
            n +
            "</small>";
          b.onclick = function () {
            setGroup(S.group === g.id ? null : g.id);
          };
          box.appendChild(b);
        });
        buildMembers();
      }
      function has(o) {
        return Object.keys(o).length > 0;
      }
      function esc(t) {
        return String(t).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function badge(d) {
        if (d.photo)
          return (
            '<img class="coat" style="object-fit:cover;border-radius:10px" src="' +
            esc(d.photo) +
            '" alt="" onerror="this.style.visibility=\'hidden\'">'
          );
        var c = "hsl(" + d.hue + " 70% 42%)";
        var extra = "";
        return (
          '<svg class="coat" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 22L38 14L50 24L62 14L90 22L98 52L80 56L78 90L22 90L20 56L2 52Z" fill="' +
          c +
          '" stroke="#0003"/>' +
          extra +
          '<path d="M38 14L50 26L50 90L44 90L44 30L34 16Z" fill="#fff"/><path d="M62 14L50 26L50 90L56 90L56 30L66 16Z" fill="#fff"/></svg>'
        );
      }
      function render() {
        var q = S.q.trim().toLowerCase();
        var active = q || S.group || has(S.year) || has(S.place) || has(S.chars);
        var main = $("main");
        if (!active) {
          var h =
            '<div class="hint"><h2>點選團體，開始翻閱圖鑑</h2><p>也可以用搜尋或「進階搜尋」直接找</p></div><div class="groups">';
          GROUPS.forEach(function (g) {
            var n = DATA.filter(function (d) {
              return d.group === g.id;
            }).length;
            h +=
              '<button class="gcard" type="button" style="--c:hsl(' +
              g.hue +
              ' 80% 55%)" data-g="' +
              g.id +
              '">' +
              (g.logo
                ? '<img class="glogo" src="' +
                  esc(g.logo) +
                  '" alt="' +
                  esc(g.name) +
                  '" onerror="this.nextSibling.hidden=false;this.remove()"><b hidden>'
                : "<b>") +
              esc(g.name) +
              "</b><small>" +
              n +
              " 件</small></button>";
          });
          main.innerHTML = h + "</div>";
          Array.prototype.forEach.call(main.querySelectorAll(".gcard"), function (b) {
            b.onclick = function () {
              setGroup(b.dataset.g);
            };
          });
          return;
        }
        var list = (CUR = DATA.filter(function (d) {
          if (S.group && d.group !== S.group) return false;
          if (S.member && d.member !== S.member) return false;
          if (has(S.chars) && !S.chars[d.group + ":" + d.member]) return false;
          if (has(S.year) && !S.year[d.year]) return false;
          if (has(S.place) && !S.place[d.place]) return false;
          if (q && (d.name + d.event + d.place + mname(d)).toLowerCase().indexOf(q) < 0) return false;
          return true;
        }));
        list.sort(function (a, b) {
          return S.sort === "new"
            ? b.date - a.date
            : S.sort === "old"
              ? a.date - b.date
              : a.name.localeCompare(b.name, "zh-Hant");
        });
        var nx = S.group && hasNext(S.group) ? '<div class="nextlive" id="nextlive"></div>' : "";
        if (!list.length) {
          main.innerHTML = nx + '<p class="empty">找不到符合的法被，試試減少篩選條件。</p>';
          if (nx) renderNext(S.group);
          return;

        var allText =
          title +
          sub +
          author +
          social +
          "整理者：官方售價（日圓・含稅）共件*資料來源：匯出日期法被圖鑑0123456789/-¥円元" +
          location.host +
          location.pathname;
        list.forEach(function (d) {
          allText += d.name + (MINE.notes[d.id] || "") + (priceText(d) || "");
        });
        try {
          await Promise.race([
            Promise.all(
              ["400 13px", "700 13px"].map(function (w) {
                return document.fonts.load(w + ' "Noto Sans TC"', allText);
              }),
            ),
            new Promise(function (r) {
              setTimeout(r, 6000);
            }),
          ]);
        } catch (e) {}
        $("ex-msg").textContent = "產生圖片中…";
        var hasPrice =
            showPrice &&
            list.some(function (d) {
              return priceText(d);
            }),
          hasNote = list.some(function (d) {
            return MINE.notes[d.id];
          });
        var SC = 2,
          FR = 26,
          IN = 30,
          CW = 180,
          IMG = 158,
          GX = 14,
          GY = 24,
          NAME = 36,
          PR = hasPrice ? 22 : 0,
          NT = hasNote ? 20 : 0,
          CH = IMG + 10 + NAME + PR + NT,
          LOGO_H = bandLogo ? 78 : 0,
          HEAD = 210 + LOGO_H,
          FOOT = 56;
        var gridW = cols * CW + (cols - 1) * GX,
          W = Math.max(FR * 2 + IN * 2 + gridW, 620);
        var gx0 = (W - gridW) / 2;
        var maxRows = Math.max(1, Math.floor((15000 - HEAD - FOOT - FR * 2) / (CH + GY))),
          rows = Math.ceil(list.length / cols),
          pages = Math.ceil(rows / maxRows);
        var now = new Date(),
          ds = now.getFullYear() + "/" + (now.getMonth() + 1) + "/" + now.getDate();
        var ink = "#3a2e28",
          soft = "#8a7a6e";
        for (var p = 0; p < pages; p++) {
          var part = list.slice(p * maxRows * cols, (p + 1) * maxRows * cols),
            r = Math.ceil(part.length / cols);
          var H = FR * 2 + HEAD + r * CH + (r - 1) * GY + FOOT;
          var c = document.createElement("canvas");
          c.width = W * SC;
          c.height = H * SC;
          var x = c.getContext("2d");
          x.scale(SC, SC);
          x.textBaseline = "top";
          x.fillStyle = color;
          x.fillRect(0, 0, W, H);
          rr(x, FR, FR, W - FR * 2, H - FR * 2, 18);
          x.fillStyle = "#fffdf6";
          x.fill();
          bunting(x, FR, FR + 6, FR + Math.min(220, W * 0.26), FR + 56, 6);
          bunting(x, W - FR - Math.min(220, W * 0.26), FR + 56, W - FR, FR + 6, 6);
          x.font = "bold 34px " + FONT;
          var tw = Math.min(W - FR * 2 - 200, Math.max(280, x.measureText(title).width + 70)),
            tx = (W - tw) / 2,
            ty = FR + 26,
            th = 66;
          rr(x, tx + 4, ty + 4, tw, th, 10);
          x.fillStyle = color;
          x.fill();
          rr(x, tx, ty, tw, th, 10);
          x.fillStyle = "#fff";
          x.fill();
          x.strokeStyle = ink;
          x.lineWidth = 2.5;
          x.stroke();
          x.fillStyle = ink;
          x.textAlign = "center";
          x.fillText(
            wrap(x, title + (pages > 1 ? "（" + (p + 1) + "/" + pages + "）" : ""), tw - 30, 1)[0],
            W / 2,
            ty + 15,
          );
          if (bandLogo) {
            var lmw = Math.min(380, W - FR * 2 - 80),
              ls = Math.min(lmw / bandLogo.width, LOGO_H / bandLogo.height),
              lw = bandLogo.width * ls,
              lh = bandLogo.height * ls;
            x.drawImage(bandLogo, (W - lw) / 2, ty + th + 14 + (LOGO_H - lh) / 2, lw, lh);
          }
          if (sub) {
            x.font = "bold 18px " + FONT;
            x.fillStyle = "#e8498c";
            x.fillText(
              wrap(x, sub, W - FR * 2 - 60, 1)[0],
              W / 2,
              ty + th + 14 + LOGO_H + (bandLogo ? 8 : 0),
            );
          }
          x.textAlign = "left";
          x.font = "13px " + FONT;
          x.fillStyle = soft;
          var iy = FR + HEAD - 46;
          if (author) x.fillText("整理者：" + author, FR + IN, iy);
          if (social) x.fillText(social, FR + IN, iy + 18);
          x.textAlign = "right";
          if (hasPrice) x.fillText("官方售價（日圓・含稅）", W - FR - IN, iy);
          x.fillText("共 " + list.length + " 件", W - FR - IN, iy + 18);
          x.strokeStyle = "#eadfce";
          x.lineWidth = 1;
          x.beginPath();
          x.moveTo(FR + IN, FR + HEAD - 8);
          x.lineTo(W - FR - IN, FR + HEAD - 8);
          x.stroke();
          part.forEach(function (d, i) {
            var cx = gx0 + (i % cols) * (CW + GX),
              cy = FR + HEAD + Math.floor(i / cols) * (CH + GY),
              ix = cx + (CW - IMG) / 2,
              im = imgs[d.id];
            if (im) {
              var s = Math.min(IMG / im.width, IMG / im.height),
                w = im.width * s,
                h = im.height * s;
              x.save();
              rr(x, ix, cy, IMG, IMG, 8);
              x.clip();
              x.drawImage(im, ix + (IMG - w) / 2, cy + (IMG - h) / 2, w, h);
              x.restore();
            } else drawCoat(x, ix + IMG / 2, cy + IMG / 2, IMG * 0.78, d.hue);
            x.textAlign = "center";
            x.fillStyle = ink;
            x.font = "bold 13px " + FONT;
            wrap(x, d.name, CW - 6, 2).forEach(function (l, k) {
              x.fillText(l, cx + CW / 2, cy + IMG + 10 + k * 17);
            });
            var y = cy + IMG + 10 + NAME;
            if (hasPrice) {
              var pt = priceText(d);
              if (pt) {
                x.font = "bold 16px " + FONT;
                x.fillStyle = ink;
                x.fillText(pt, cx + CW / 2, y);
              }
              y += PR;
            }
            if (MINE.notes[d.id]) {
              x.font = "bold 13px " + FONT;
              x.fillStyle = "#e8498c";
              x.fillText(wrap(x, MINE.notes[d.id], CW - 6, 1)[0], cx + CW / 2, y);
            }
          });
          x.textAlign = "left";
          x.font = "12px " + FONT;
          x.fillStyle = soft;
          x.fillText(
            "*資料來源：" +
              (/^https?:/.test(location.protocol)
                ? location.host + location.pathname.replace(/[^/]*$/, "")
                : "法被圖鑑"),
            FR + IN,
            H - FR - 36,
          );
          x.textAlign = "right";
          x.fillText("匯出日期 " + ds, W - FR - IN, H - FR - 36);
          x.textAlign = "left";
          var blob = await new Promise(function (res) {
            c.toBlob(res, "image/png");
          });
          if (!blob) {
            $("ex-msg").textContent = "產生失敗：圖片太大，請減少件數後再試。";
            $("ex-go").disabled = false;
            return;
          }
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download =
            title.replace(/[\\/:*?"<>|]/g, "_") +
            "-" +
            now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, "0") +
            String(now.getDate()).padStart(2, "0") +
            (pages > 1 ? "-" + (p + 1) : "") +
            ".png";
          document.body.appendChild(a);
          a.click();
          a.remove();
          (function (u) {
            setTimeout(function () {
              URL.revokeObjectURL(u);
            }, 5000);
          })(a.href);
        }
        $("ex-msg").textContent =
          "完成！已下載 " +
          pages +
          " 張 PNG" +
          (bad ? "。有 " + bad + " 張照片無法載入，已用法被圖示代替。" : "。");
        $("ex-go").disabled = false;
      }
      $("export").onclick = openExport;
      $("ex-go").onclick = function () {
        doExport().catch(function (e) {
          $("ex-msg").textContent = "匯出失敗：" + e.message;
          $("ex-go").disabled = false;
        });
      };
      $("ex-close").onclick = function () {
        $("exdlg").close();
      };
      $("exdlg").addEventListener("click", function (e) {
        if (e.target === this) this.close();
      });
      updateExportBtn();
      var ARTIST = {
        poppinparty: 8,
        afterglow: 9,
        pastelpalettes: 10,
        roselia: 11,
        hellohappyworld: 12,
        morfonica: 13,
        raiseasuilen: 14,
        mygo: 15,
        avemujica: 16,
        夢限大mewtype: 17,
      };
      var GBC = { togenashitogeari: "tgtg", diamonddust: "dd" };
      var GBC_URL = "https://raw.githubusercontent.com/Aemo-0304/hapi/data/gbc-lives.json",
        GBC_P = null;
      var NEXT = {};
      function gkey(gid) {
        var g = GROUPS.filter(function (x) {
          return x.id === gid;
        })[0];
        return g ? g.name.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, "") : "";
      }
      function hasNext(gid) {
        var k = gkey(gid);
        return !!(ARTIST[k] || GBC[k]);
      }
      function loadGbc(key) {
        if (!GBC_P)
          GBC_P = fetch(GBC_URL, { cache: "no-cache" })
            .then(function (r) {
              if (!r.ok) throw new Error(r.status);
              return r.json();
            })
            .catch(function (e) {
              GBC_P = null;
              throw e;
            });
        var today = todayStr();
        return GBC_P.then(function (j) {
          var best = null;
          (j.events || []).forEach(function (e) {
            if ((e.groups || []).indexOf(key) < 0) return;
            (e.items || []).forEach(function (it) {
              if (it.date >= today && (!best || it.date < best.start))
                best = { title: e.title, link: e.link, start: it.date, when: "", place: it.place || "" };
            });
          });
          return best;
        }).catch(function () {
          return undefined;
        });
      }
      function artistId(gid) {
        return ARTIST[gkey(gid)] || 0;
      }
      function todayStr() {
        var n = new Date();
        return (
          n.getFullYear() +
          "-" +
          String(n.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(n.getDate()).padStart(2, "0")
        );
      }
      function loadNext(aid) {
        if (NEXT[aid]) return NEXT[aid];
        var today = todayStr();
        NEXT[aid] = fetch(
          LIVES_API +
            "events?tax_artist=" +
            aid +
            "&per_page=50&_fields=title,link,acf.cf_events_dates,acf.cf_events_schedule,acf.cf_events_place",
        )
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          })
          .then(function (j) {
            var up = j
              .map(function (e) {
                var a = e.acf || {},
                  d = a.cf_events_dates || {};
                return {
                  title: decodeHtml((e.title && e.title.rendered) || ""),
                  link: e.link,
                  start: (d.cf_events_dates_start || "").slice(0, 10),
                  when: a.cf_events_schedule || "",
                  place: a.cf_events_place || "",
                };
              })
              .filter(function (e) {
                return e.start && e.start >= today;
              })
              .sort(function (a, b) {
                return a.start.localeCompare(b.start);
              });
            return up[0] || null;
          })
          .catch(function () {
            delete NEXT[aid];
            return undefined;
          });
        return NEXT[aid];
      }
      function renderNext(gid) {
        var aid = artistId(gid),
          gk = GBC[gkey(gid)],
          box = $("nextlive");
        if (!box || !(aid || gk)) return;
        box.innerHTML = '<span class="nl-tag">下一場活動</span><span class="nl-loading">讀取中…</span>';
        (aid ? loadNext(aid) : loadGbc(gk)).then(function (e) {
          box = $("nextlive");
          if (!box || S.group !== gid) return;
          if (e === undefined) {
            box.remove();
            return;
          }
          if (!e) {
            box.innerHTML =
              '<span class="nl-tag">下一場活動</span><span class="nl-loading">官網目前沒有已公布的活動</span>';
            return;
          }
          var t = todayStr().split("-"),
            s = e.start.split("-");
          var days = Math.round(
            (Date.UTC(+s[0], s[1] - 1, +s[2]) - Date.UTC(+t[0], t[1] - 1, +t[2])) / 86400000,
          );
          box.innerHTML =
            '<a href="' +
            esc(e.link) +
            '" target="_blank" rel="noopener">' +
            '<div class="nl-count">' +
            (days === 0 ? "<b>今天</b>" : "倒數<b>" + days + "</b>天") +
            "</div>" +
            '<div class="nl-info"><span class="nl-tag">下一場活動</span><h3>' +
            esc(e.title) +
            "</h3>" +
            "<small>📅 " +
            esc(e.when || e.start.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, "$1年$2月$3日")) +
            (e.place ? "　📍 " + esc(e.place) : "") +
            "</small></div></a>";
        });
      }
      var LIVES = null,
        LIVES_ERR = false,
        LIVES_API = "https://bang-dream.com/wp-json/wp/v2/";
      function decodeHtml(s) {
        var t = document.createElement("textarea");
        t.innerHTML = s;
        return t.value;
      }
      function loadLives() {
        try {
          var c = JSON.parse(sessionStorage.getItem("hapi-lives4") || "null");
          if (c && Date.now() - c.t < 3600000) {
            LIVES = c.d;
            return Promise.resolve();
          }
        } catch (e) {}
        var now = new Date(),
          today =
            now.getFullYear() +
            "-" +
            String(now.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(now.getDate()).padStart(2, "0");
        return fetch(
          LIVES_API +
            "events?tax_events=51&per_page=50&_fields=id,title,link,featured_media,acf.cf_events_dates,acf.cf_events_schedule,acf.cf_events_place,acf.cf_events_image",
        )
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          })
          .then(function (j) {
            var up = j
              .map(function (e) {
                var a = e.acf || {},
                  d = a.cf_events_dates || {};
                return {
                  title: decodeHtml((e.title && e.title.rendered) || ""),
                  link: e.link,
                  start: d.cf_events_dates_start || "",
                  end: d.cf_events_dates_end || "",
                  when: a.cf_events_schedule || "",
                  place: a.cf_events_place || "",
                  img: a.cf_events_image || 0,
                  fm: e.featured_media || 0,
                };
              })
              .filter(function (e) {
                return e.start && e.start.slice(0, 10) >= today;
              })
              .sort(function (a, b) {
                return a.start.localeCompare(b.start);
              })
              .slice(0, 4);
            var ids = [];
            up.forEach(function (e) {
              if (e.img) ids.push(e.img);
              if (e.fm) ids.push(e.fm);
            });
            return (
              ids.length
                ? fetch(
                    LIVES_API + "media?include=" + ids.join(",") + "&per_page=20&_fields=id,source_url",
                  ).then(function (r) {
                    return r.ok ? r.json() : [];
                  })
                : Promise.resolve([])
            ).then(function (m) {
              var map = {};
              m.forEach(function (x) {
                map[x.id] = x.source_url;
              });
              up.forEach(function (e) {
                e.src = map[e.img] || map[e.fm] || "";
              });
              LIVES = up;
              try {
                sessionStorage.setItem("hapi-lives4", JSON.stringify({ t: Date.now(), d: up }));
              } catch (e) {}
            });
          })
          .catch(function () {
            LIVES_ERR = true;
          });
      }
      function renderLives() {
        var box = $("lives");
        if (!box) return;
        var head =
          '<div class="lives-head"><h2>近期演唱會</h2><a href="https://bang-dream.com/events/" target="_blank" rel="noopener">資料來源：BanG Dream! 官方網站 ›</a></div>';
        if (LIVES_ERR) {
          box.innerHTML =
            head + '<p class="lives-loading">暫時無法取得演唱會資訊，請點右上方連結到官網查看。</p>';
          return;
        }
        if (!LIVES) {
          box.innerHTML = head + '<p class="lives-loading">載入中…</p>';
          return;
        }
        if (!LIVES.length) {
          box.innerHTML = head + '<p class="lives-loading">目前沒有即將舉行的演唱會。</p>';
          return;
        }
        box.innerHTML =
          head +
          '<div class="lives-grid">' +
          LIVES.map(function (e) {
            return (
              '<a class="live" href="' +
              esc(e.link) +
              '" target="_blank" rel="noopener">' +
              '<div class="live-img">' +
              (e.src ? '<img src="' + esc(e.src) + '" alt="" loading="lazy" onerror="this.remove()">' : "") +
              "</div>" +
              '<div class="live-body"><b class="live-date">' +
              esc(e.when || e.start.slice(0, 10)) +
              "</b><h3>" +
              esc(e.title) +
              "</h3>" +
              (e.place ? "<small>📍 " + esc(e.place) + "</small>" : "") +
              "</div></a>"
            );
          }).join("") +
          "</div>";
      }
      $("livesbtn").onclick = function () {
        LIVES_ERR = false;
        renderLives();
        $("livesdlg").showModal();
        if (!LIVES) loadLives().then(renderLives);
      };
      $("lives-close").onclick = function () {
        $("livesdlg").close();
      };
      $("livesdlg").addEventListener("click", function (e) {
        if (e.target === this) this.close();
      });
      buildFilters();
      buildChips();
      render();
    </script>
  </body>
