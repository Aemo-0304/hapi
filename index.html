<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法被圖鑑｜收藏資料庫</title>
</head>
<body>
<header>
  <h1>法被圖鑑</h1>
  <div style="display:flex;gap:8px">
    <button class="iconbtn" id="help" type="button">說明</button>
    <button class="iconbtn" id="theme" type="button" aria-label="切換深色或淺色模式">🌙</button>
  </div>
  <link rel="stylesheet" type="text/css" href="HAPI.CSS"/>
</header>

<div class="bar">
  <input type="search" id="q" placeholder="搜尋名稱、活動或法被…" aria-label="搜尋">
  <select id="sort" aria-label="排序方式">
    <option value="new">發售日期（新→舊）</option>
    <option value="old">發售日期（舊→新）</option>
    <option value="name">名稱（A→Z）</option>
  </select>
</div>
<div class="chips" id="chips" role="group" aria-label="依團體篩選"></div>
<div class="chips" id="members" role="group" aria-label="依角色篩選" style="display:none"></div>

<div class="layout">
  <aside aria-label="篩選條件">
    <details open><summary>發售年份</summary><div class="opts" id="f-year"></div></details>
    <details open><summary>角色人物</summary><div class="opts" id="f-char" style="max-height:280px"></div></details>
    <details><summary>販售地點</summary><div class="opts" id="f-place"></div></details>
    <button class="reset" id="reset" type="button">重置所有篩選</button>
  </aside>
  <main id="main"></main>
</div>
<footer><a href="https://www.threads.com/@aemo_gbp?hl=zh-tw" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">聯繫我</a></footer>

<dialog id="helpdlg" aria-labelledby="help-title" style="max-width:440px">
  <h2 id="help-title" style="margin:0 0 12px;font-size:20px">使用說明</h2>
  <div class="helpbody" id="help-body"></div>
  <button class="close" id="help-close" type="button">知道了</button>
</dialog>
<dialog id="dlg" aria-labelledby="d-name">
  <div class="d-img"><div id="d-img"></div><button class="d-x" id="dlg-close" type="button" aria-label="關閉">✕</button></div>
  <div class="d-body">
    <div class="d-tags" id="d-tags"></div>
    <h2 id="d-name"></h2>
    <div class="d-fields" id="d-fields"></div>
    <div class="d-nav">
      <button type="button" id="d-prev">‹ 上一個</button>
      <span id="d-pos"></span>
      <button type="button" id="d-next">下一個 ›</button>
    </div>
  </div>
</dialog>

<script src="db.js"></script>
<script src="data.js"></script>
<script>
var DB=Store.load();
var GROUPS=DB.groups, PLACES=DB.places;
var DATA=DB.items.filter(function(d){return GROUPS.some(function(g){return g.id===d.group})});
DATA.forEach(function(d){d.hue=GROUPS.filter(function(g){return g.id===d.group})[0].hue;d.date=d.year*100+d.month});

// ===== 狀態 =====
var S={q:"",group:null,member:null,year:{},place:{},chars:{},sort:"new"};
var $=function(id){return document.getElementById(id)};
function gname(id){return GROUPS.filter(function(g){return g.id===id})[0].name}
function gobj(id){return GROUPS.filter(function(g){return g.id===id})[0]}
function mname(d){
  if(!d.member)return "";
  var g=gobj(d.group);
  if(d.member==="all")return g.name+"全團";
  var m=(g.members||[]).filter(function(m){return m.id===d.member})[0];
  return m?m.name:"";
}
function setGroup(id){S.group=id;S.member=null;buildChips();render()}
function buildMembers(){
  var box=$("members"),g=S.group&&gobj(S.group);
  if(!g||!g.members||!g.members.length){box.style.display="none";box.innerHTML="";return}
  box.style.display="";
  box.innerHTML='<span style="align-self:center;color:var(--muted);font-size:14px">角色</span>';
  [{id:"all",name:g.name+"全團",color:"hsl("+g.hue+" 80% 55%)"}].concat(g.members).forEach(function(m){
    var n=DATA.filter(function(d){return d.group===g.id&&d.member===m.id}).length;
    var b=document.createElement("button");b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",S.member===m.id);
    b.innerHTML='<i style="background:'+m.color+'"></i>'+esc(m.name)+' <small>'+n+'</small>';
    b.onclick=function(){S.member=S.member===m.id?null:m.id;buildMembers();render()};
    box.appendChild(b);
  });
}

function buildOpts(key,el,vals){
  el.innerHTML="";
  vals.forEach(function(v){
    var l=document.createElement("label"),c=document.createElement("input");
    c.type="checkbox";c.checked=!!S[key][v];
    c.onchange=function(){if(c.checked)S[key][v]=1;else delete S[key][v];render()};
    l.appendChild(c);l.appendChild(document.createTextNode(v));el.appendChild(l);
  });
}
function buildFilters(){
  var ys={};DATA.forEach(function(d){ys[d.year]=1});
  buildOpts("year",$("f-year"),Object.keys(ys).map(Number).sort(function(a,b){return b-a}));
  buildOpts("place",$("f-place"),PLACES);
  buildChars();
}
// 左側「角色人物」：列出有團員的團體，依團體分組，可複選（key = 團體id:團員id）
function buildChars(){
  var el=$("f-char");el.innerHTML="";
  var gs=GROUPS.filter(function(g){return g.members&&g.members.length});
  if(!gs.length){el.innerHTML='<span style="color:var(--muted);font-size:14px">尚未設定團員，可到後台新增</span>';return}
  gs.forEach(function(g){
    if(gs.length>1){var h=document.createElement("b");h.textContent=g.name;h.style.cssText="font-size:13px;color:var(--muted);margin-top:4px";el.appendChild(h)}
    [{id:"all",name:g.name+"全團",color:"hsl("+g.hue+" 80% 55%)"}].concat(g.members).forEach(function(m){
      var k=g.id+":"+m.id,n=DATA.filter(function(d){return d.group===g.id&&d.member===m.id}).length;
      var l=document.createElement("label"),c=document.createElement("input");
      c.type="checkbox";c.checked=!!S.chars[k];
      c.onchange=function(){if(c.checked)S.chars[k]=1;else delete S.chars[k];render()};
      var dot=document.createElement("i");dot.style.cssText="width:10px;height:10px;border-radius:50%;flex:none;background:"+m.color;
      var t=document.createElement("span");t.textContent=m.name;t.style.flex="1";
      var c2=document.createElement("small");c2.textContent=n;c2.style.color="var(--muted)";
      l.appendChild(c);l.appendChild(dot);l.appendChild(t);l.appendChild(c2);el.appendChild(l);
    });
  });
}
function buildChips(){
  var box=$("chips");box.innerHTML="";
  GROUPS.forEach(function(g){
    var n=DATA.filter(function(d){return d.group===g.id}).length;
    var b=document.createElement("button");b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",S.group===g.id);
    b.innerHTML='<i style="background:hsl('+g.hue+' 80% 55%)"></i>'+esc(g.name)+' <small>'+n+'</small>';
    b.onclick=function(){setGroup(S.group===g.id?null:g.id)};
    box.appendChild(b);
  });
  buildMembers();
}
function has(o){return Object.keys(o).length>0}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function badge(d){
  if(d.photo)return '<img class="coat" style="object-fit:cover;border-radius:10px" src="'+esc(d.photo)+'" alt="" onerror="this.style.visibility=\'hidden\'">';
  var c="hsl("+d.hue+" 70% 42%)";
  var extra='';
  return '<svg class="coat" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 22L38 14L50 24L62 14L90 22L98 52L80 56L78 90L22 90L20 56L2 52Z" fill="'+c+'" stroke="#0003"/>'+extra+'<path d="M38 14L50 26L50 90L44 90L44 30L34 16Z" fill="#fff"/><path d="M62 14L50 26L50 90L56 90L56 30L66 16Z" fill="#fff"/></svg>';
}
function render(){
  var q=S.q.trim().toLowerCase();
  var active=q||S.group||has(S.year)||has(S.place)||has(S.chars);
  var main=$("main");
  if(!active){
    var h='<div class="hint"><h2>點選團體，開始翻閱圖鑑</h2><p>也可以用搜尋或左側條件直接找</p></div><div class="groups">';
    GROUPS.forEach(function(g){
      var n=DATA.filter(function(d){return d.group===g.id}).length;
      h+='<button class="gcard" type="button" style="--c:hsl('+g.hue+' 80% 55%)" data-g="'+g.id+'">'+(g.logo?'<img class="glogo" src="'+esc(g.logo)+'" alt="'+esc(g.name)+'" onerror="this.nextSibling.hidden=false;this.remove()"><b hidden>':'<b>')+esc(g.name)+'</b><small>'+n+' 件</small></button>';
    });
    main.innerHTML=h+"</div>";
    Array.prototype.forEach.call(main.querySelectorAll(".gcard"),function(b){
      b.onclick=function(){setGroup(b.dataset.g)};
    });
    return;
  }
  var list=CUR=DATA.filter(function(d){
    if(S.group&&d.group!==S.group)return false;
    if(S.member&&d.member!==S.member)return false;
    if(has(S.chars)&&!S.chars[d.group+":"+d.member])return false;
    if(has(S.year)&&!S.year[d.year])return false;
    if(has(S.place)&&!S.place[d.place])return false;
    if(q&&(d.name+d.event+d.place+mname(d)).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  list.sort(function(a,b){return S.sort==="new"?b.date-a.date:S.sort==="old"?a.date-b.date:a.name.localeCompare(b.name,"zh-Hant")});
  if(!list.length){main.innerHTML='<p class="empty">找不到符合的法被，試試減少篩選條件。</p>';return}
  var h='<p class="count">共 '+list.length+' 件</p><div class="grid">';
  list.forEach(function(d){
    h+='<button class="item" type="button" data-id="'+d.id+'">'+badge(d)+'<h3>'+esc(d.name)+'</h3><small>'+(mname(d)?esc(mname(d))+"・":"")+d.year+" 年 "+d.month+' 月</small></button>';
  });
  main.innerHTML=h+"</div>";
  Array.prototype.forEach.call(main.querySelectorAll(".item"),function(b){b.onclick=function(){openDlg(+b.dataset.id)}});
}
// ===== 詳細資訊（放大檢視，可上一個／下一個翻頁）=====
var CUR=[],curId=null;
function mcolor(d){
  var g=gobj(d.group);if(d.member==="all")return "hsl("+g.hue+" 80% 55%)";
  var m=(g.members||[]).filter(function(m){return m.id===d.member})[0];return m?m.color:"";
}
function field(label,val,full){return val?'<div'+(full?' class="full"':'')+'><label>'+label+'</label><span>'+esc(val)+'</span></div>':""}
function openDlg(id){
  var d=DATA.filter(function(x){return x.id===id})[0];curId=id;
  var gc="hsl("+d.hue+" 75% 45%)";
  var box=$("d-img");box.innerHTML="";
  if(d.photo){
    var im=new Image();im.src=d.photo;im.alt=d.name;im.title="點擊開啟原圖";
    im.onclick=function(){window.open(d.photo,"_blank")};
    im.onerror=function(){box.innerHTML=badge({hue:d.hue})};
    box.appendChild(im);
  }else box.innerHTML=badge({hue:d.hue});
  $("d-tags").innerHTML='<span class="d-tag" style="--c:'+gc+'">'+esc(gname(d.group))+'</span>'
    +(mname(d)?'<span class="d-tag" style="--c:'+mcolor(d)+'">'+esc(mname(d))+'</span>':'');
  $("d-name").textContent=d.name;
  $("d-fields").innerHTML=field("發售日期",d.year+" 年 "+d.month+" 月")+field("販售地點",d.place)+field("活動／商品",d.event,true);
  var i=CUR.indexOf(d);
  $("d-pos").textContent=i>=0?(i+1)+" / "+CUR.length:"";
  $("d-prev").disabled=i<=0;$("d-next").disabled=i<0||i>=CUR.length-1;
  if(!$("dlg").open)$("dlg").showModal();
}
function navDlg(n){var i=CUR.findIndex(function(d){return d.id===curId})+n;if(i>=0&&i<CUR.length)openDlg(CUR[i].id)}
$("d-prev").onclick=function(){navDlg(-1)};
$("d-next").onclick=function(){navDlg(1)};
document.addEventListener("keydown",function(e){if(!$("dlg").open)return;if(e.key==="ArrowLeft")navDlg(-1);if(e.key==="ArrowRight")navDlg(1)});
$("dlg-close").onclick=function(){$("dlg").close()};
$("help").onclick=function(){
  $("help-title").textContent=DB.helpTitle||Store.helpTitle;
  $("help-body").innerHTML=Store.helpHtml(DB.help!=null?DB.help:Store.helpText);
  $("helpdlg").showModal();
};
$("help-close").onclick=function(){$("helpdlg").close()};
$("helpdlg").addEventListener("click",function(e){if(e.target===this)this.close()});
$("dlg").addEventListener("click",function(e){if(e.target===this)this.close()});
$("q").oninput=function(){S.q=this.value;render()};
$("sort").onchange=function(){S.sort=this.value;render()};
$("reset").onclick=function(){S.q="";S.group=null;S.member=null;S.year={};S.place={};S.chars={};$("q").value="";buildFilters();buildChips();render()};
$("theme").onclick=function(){
  var root=document.documentElement,dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme",dark?"light":"dark");this.textContent=dark?"🌙":"☀️";
};
buildFilters();buildChips();render();
</script>
</body>
</html>
