<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法被圖鑑｜收藏資料庫</title>
</head>
<body>
<header>
  <h1>法被圖鑑</h1>
  <div style="display:flex;gap:8px">
    <span class="iconbtn counter" id="visits" title="累計到訪人數（同一個瀏覽器分頁只算一次）">到訪人數：…</span>
    <button class="iconbtn" id="shop" type="button">二手平台推薦</button>
    <button class="iconbtn" id="help" type="button">更新日誌</button>
    <button class="iconbtn" id="theme" type="button" aria-label="切換深色或淺色模式">🌙</button>
  </div>
  <link rel="stylesheet" type="text/css" href="HAPI.CSS"/>
</header>

<div class="bar">
  <input type="search" id="q" placeholder="搜尋名稱、活動或法被…" aria-label="搜尋">
  <select id="sort" aria-label="排序方式">
    <option value="new">發售日期（新→舊）</option>
    <option value="old">發售日期（舊→新）</option>
    <option value="name">名稱（A→Z）</option>
  </select>
  <button class="btn-export" id="export" type="button">⬇ 匯出圖鑑</button>
</div>
<div class="chips" id="chips" role="group" aria-label="依團體篩選"></div>
<div class="chips" id="members" role="group" aria-label="依角色篩選" style="display:none"></div>

<div class="layout">
  <aside aria-label="篩選條件">
    <details open><summary>發售年份</summary><div class="opts" id="f-year"></div></details>
    <details open><summary>角色人物</summary><div class="opts" id="f-char" style="max-height:280px"></div></details>
    <details><summary>販售地點</summary><div class="opts" id="f-place"></div></details>
    <button class="reset" id="reset" type="button">重置所有篩選</button>
  </aside>
  <main id="main"></main>
</div>
<footer><a href="https://www.threads.com/@aemo_gbp?hl=zh-tw" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">聯繫我</a></footer>

<dialog id="exdlg" aria-labelledby="ex-h" class="exdlg">
  <h2 id="ex-h" style="margin:0 0 14px;font-size:20px">匯出圖鑑（PNG）</h2>
  <div class="exform">
    <fieldset><legend>要放哪些法被 <b id="ex-count"></b></legend>
      <label class="row"><input type="radio" name="exr" id="ex-custom-r"> 依樂團／人物／活動挑選</label>
      <div class="ex3" id="ex-custom">
        <label>樂團<select id="ex-g"></select></label>
        <label>人物<select id="ex-m"></select></label>
        <label>活動<select id="ex-e"></select></label>
      </div>
      <label class="row"><input type="radio" name="exr" id="ex-mine"> <span id="ex-mine-lab">我勾選的</span></label>
      <p class="exhint">在法被卡片右上角點「＋」可以自己挑選，勾選會記在這個瀏覽器裡。</p>
    </fieldset>
    <label>標題<input type="text" id="ex-title" maxlength="30"></label>
    <label>副標題<input type="text" id="ex-sub" maxlength="40" placeholder="（可不填）"></label>
    <div class="ex2">
      <label>整理者<input type="text" id="ex-author" maxlength="30" placeholder="（可不填）"></label>
      <label>社群帳號<input type="text" id="ex-social" maxlength="40" placeholder="Threads / IG …"></label>
    </div>
    <div class="ex2">
      <label>每排件數<select id="ex-cols"><option>3</option><option>4</option><option selected>5</option></select></label>
      <label>外框顏色<input type="color" id="ex-color" value="#f9d77e"></label>
    </div>
    <label class="row"><input type="checkbox" id="ex-price" checked> 顯示官方售價</label>
    <details class="exnotes"><summary>每件的備註（已收、待收…）<span id="ex-notes-n"></span></summary>
      <p class="exhint">填了的會用粉紅字印在價格下方，沒填就不顯示。</p>
      <div id="ex-notes"></div>
    </details>
    <p class="exmsg" id="ex-msg" role="status"></p>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="reset" id="ex-clear" type="button" style="margin:0;width:auto;padding:9px 14px">清空勾選</button>
    <button class="reset" id="ex-close" type="button" style="margin:0;flex:1">關閉</button>
    <button class="close" id="ex-go" type="button" style="flex:2">產生並下載 PNG</button>
  </div>
</dialog>
<dialog id="shopdlg" aria-labelledby="shop-title" style="max-width:440px">
  <h2 id="shop-title" style="margin:0 0 12px;font-size:20px">二手平台推薦</h2>
  <div class="helpbody" id="shop-body"></div>
  <button class="close" id="shop-close" type="button">關閉</button>
</dialog>
<dialog id="helpdlg" aria-labelledby="help-title" style="max-width:440px">
  <h2 id="help-title" style="margin:0 0 12px;font-size:20px">更新日誌</h2>
  <div class="helpbody" id="help-body"></div>
  <button class="close" id="help-close" type="button">知道了</button>
</dialog>
<dialog id="dlg" aria-labelledby="d-name">
  <div class="d-img"><div id="d-img"></div><button class="d-x" id="dlg-close" type="button" aria-label="關閉">✕</button></div>
  <div class="d-body">
    <div class="d-tags" id="d-tags"></div>
    <h2 id="d-name"></h2>
    <div class="d-fields" id="d-fields"></div>
    <button type="button" class="d-pick" id="d-pick"></button>
    <div class="d-nav">
      <button type="button" id="d-prev">‹ 上一個</button>
      <span id="d-pos"></span>
      <button type="button" id="d-next">下一個 ›</button>
    </div>
  </div>
</dialog>

<script src="db.js"></script>
<script src="data.js"></script>
<script>
// ===== 資料（由 data.js 載入，可在後台 admin.html 編輯）=====
var DB=Store.load();
var GROUPS=DB.groups, PLACES=DB.places;
var DATA=DB.items.filter(function(d){return GROUPS.some(function(g){return g.id===d.group})});
DATA.forEach(function(d){d.hue=GROUPS.filter(function(g){return g.id===d.group})[0].hue;d.date=d.year*100+d.month});

// ===== 狀態 =====
var S={q:"",group:null,member:null,year:{},place:{},chars:{},sort:"new"};
var $=function(id){return document.getElementById(id)};
function gname(id){return GROUPS.filter(function(g){return g.id===id})[0].name}
function gobj(id){return GROUPS.filter(function(g){return g.id===id})[0]}
function mname(d){
  if(!d.member)return "";
  var g=gobj(d.group);
  if(d.member==="all")return g.name+"全團";
  var m=(g.members||[]).filter(function(m){return m.id===d.member})[0];
  return m?m.name:"";
}
function setGroup(id){S.group=id;S.member=null;buildChips();render()}
function buildMembers(){
  var box=$("members"),g=S.group&&gobj(S.group);
  if(!g||!g.members||!g.members.length){box.style.display="none";box.innerHTML="";return}
  box.style.display="";
  box.innerHTML='<span style="align-self:center;color:var(--muted);font-size:14px">角色</span>';
  [{id:"all",name:g.name+"全團",color:"hsl("+g.hue+" 80% 55%)"}].concat(g.members).forEach(function(m){
    var n=DATA.filter(function(d){return d.group===g.id&&d.member===m.id}).length;
    var b=document.createElement("button");b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",S.member===m.id);
    b.innerHTML='<i style="background:'+m.color+'"></i>'+esc(m.name)+' <small>'+n+'</small>';
    b.onclick=function(){S.member=S.member===m.id?null:m.id;buildMembers();render()};
    box.appendChild(b);
  });
}

function buildOpts(key,el,vals){
  el.innerHTML="";
  vals.forEach(function(v){
    var l=document.createElement("label"),c=document.createElement("input");
    c.type="checkbox";c.checked=!!S[key][v];
    c.onchange=function(){if(c.checked)S[key][v]=1;else delete S[key][v];render()};
    l.appendChild(c);l.appendChild(document.createTextNode(v));el.appendChild(l);
  });
}
function buildFilters(){
  var ys={};DATA.forEach(function(d){ys[d.year]=1});
  buildOpts("year",$("f-year"),Object.keys(ys).map(Number).sort(function(a,b){return b-a}));
  buildOpts("place",$("f-place"),PLACES);
  buildChars();
}
// 左側「角色人物」：列出有團員的團體，依團體分組，可複選（key = 團體id:團員id）
function buildChars(){
  var el=$("f-char");el.innerHTML="";
  var gs=GROUPS.filter(function(g){return g.members&&g.members.length});
  if(!gs.length){el.innerHTML='<span style="color:var(--muted);font-size:14px">尚未設定團員，可到後台新增</span>';return}
  gs.forEach(function(g){
    if(gs.length>1){var h=document.createElement("b");h.textContent=g.name;h.style.cssText="font-size:13px;color:var(--muted);margin-top:4px";el.appendChild(h)}
    [{id:"all",name:g.name+"全團",color:"hsl("+g.hue+" 80% 55%)"}].concat(g.members).forEach(function(m){
      var k=g.id+":"+m.id,n=DATA.filter(function(d){return d.group===g.id&&d.member===m.id}).length;
      var l=document.createElement("label"),c=document.createElement("input");
      c.type="checkbox";c.checked=!!S.chars[k];
      c.onchange=function(){if(c.checked)S.chars[k]=1;else delete S.chars[k];render()};
      var dot=document.createElement("i");dot.style.cssText="width:10px;height:10px;border-radius:50%;flex:none;background:"+m.color;
      var t=document.createElement("span");t.textContent=m.name;t.style.flex="1";
      var c2=document.createElement("small");c2.textContent=n;c2.style.color="var(--muted)";
      l.appendChild(c);l.appendChild(dot);l.appendChild(t);l.appendChild(c2);el.appendChild(l);
    });
  });
}
function buildChips(){
  var box=$("chips");box.innerHTML="";
  GROUPS.forEach(function(g){
    var n=DATA.filter(function(d){return d.group===g.id}).length;
    var b=document.createElement("button");b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",S.group===g.id);
    b.innerHTML=(g.icon?'<img class="chip-icon" src="'+esc(g.icon)+'" alt="">':'<i style="background:hsl('+g.hue+' 80% 55%)"></i>')+esc(g.name)+' <small>'+n+'</small>';
    b.onclick=function(){setGroup(S.group===g.id?null:g.id)};
    box.appendChild(b);
  });
  buildMembers();
}
function has(o){return Object.keys(o).length>0}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function badge(d){
  if(d.photo)return '<img class="coat" style="object-fit:cover;border-radius:10px" src="'+esc(d.photo)+'" alt="" onerror="this.style.visibility=\'hidden\'">';
  var c="hsl("+d.hue+" 70% 42%)";
  var extra='';
  return '<svg class="coat" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 22L38 14L50 24L62 14L90 22L98 52L80 56L78 90L22 90L20 56L2 52Z" fill="'+c+'" stroke="#0003"/>'+extra+'<path d="M38 14L50 26L50 90L44 90L44 30L34 16Z" fill="#fff"/><path d="M62 14L50 26L50 90L56 90L56 30L66 16Z" fill="#fff"/></svg>';
}
function render(){
  var q=S.q.trim().toLowerCase();
  var active=q||S.group||has(S.year)||has(S.place)||has(S.chars);
  var main=$("main");
  if(!active){
    var h='<div class="hint"><h2>點選團體，開始翻閱圖鑑</h2><p>也可以用搜尋或左側條件直接找</p></div><div class="groups">';
    GROUPS.forEach(function(g){
      var n=DATA.filter(function(d){return d.group===g.id}).length;
      h+='<button class="gcard" type="button" style="--c:hsl('+g.hue+' 80% 55%)" data-g="'+g.id+'">'+(g.logo?'<img class="glogo" src="'+esc(g.logo)+'" alt="'+esc(g.name)+'" onerror="this.nextSibling.hidden=false;this.remove()"><b hidden>':'<b>')+esc(g.name)+'</b><small>'+n+' 件</small></button>';
    });
    main.innerHTML=h+"</div>";
    Array.prototype.forEach.call(main.querySelectorAll(".gcard"),function(b){
      b.onclick=function(){setGroup(b.dataset.g)};
    });
    return;
  }
  var list=CUR=DATA.filter(function(d){
    if(S.group&&d.group!==S.group)return false;
    if(S.member&&d.member!==S.member)return false;
    if(has(S.chars)&&!S.chars[d.group+":"+d.member])return false;
    if(has(S.year)&&!S.year[d.year])return false;
    if(has(S.place)&&!S.place[d.place])return false;
    if(q&&(d.name+d.event+d.place+mname(d)).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  list.sort(function(a,b){return S.sort==="new"?b.date-a.date:S.sort==="old"?a.date-b.date:a.name.localeCompare(b.name,"zh-Hant")});
  if(!list.length){main.innerHTML='<p class="empty">找不到符合的法被，試試減少篩選條件。</p>';return}
  var h='<p class="count">共 '+list.length+' 件</p><div class="grid">';
  list.forEach(function(d){
    var pk=MINE.ids.indexOf(d.id)>=0;
    h+='<button class="item'+(pk?' picked':'')+'" type="button" data-id="'+d.id+'"><span class="pick" role="checkbox" tabindex="0" aria-checked="'+pk+'" aria-label="加入我的圖鑑" title="加入／移出我的圖鑑"></span>'+badge(d)+'<h3>'+esc(d.name)+'</h3><small>'+(mname(d)?esc(mname(d))+"・":"")+d.year+" 年 "+d.month+' 月</small></button>';
  });
  main.innerHTML=h+"</div>";
  Array.prototype.forEach.call(main.querySelectorAll(".item"),function(b){b.onclick=function(e){
    if(e.target.classList.contains("pick")){togglePick(+b.dataset.id,b);return}
    openDlg(+b.dataset.id)}});
  Array.prototype.forEach.call(main.querySelectorAll(".pick"),function(p){p.onkeydown=function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();e.stopPropagation();togglePick(+p.parentNode.dataset.id,p.parentNode)}}});
}
// ===== 詳細資訊（放大檢視，可上一個／下一個翻頁）=====
var CUR=[],curId=null;
function mcolor(d){
  var g=gobj(d.group);if(d.member==="all")return "hsl("+g.hue+" 80% 55%)";
  var m=(g.members||[]).filter(function(m){return m.id===d.member})[0];return m?m.color:"";
}
function field(label,val,full){return val?'<div'+(full?' class="full"':'')+'><label>'+label+'</label><span>'+esc(val)+'</span></div>':""}
function openDlg(id){
  var d=DATA.filter(function(x){return x.id===id})[0];curId=id;
  var gc="hsl("+d.hue+" 75% 45%)";
  var box=$("d-img");box.innerHTML="";
  if(d.photo){
    var im=new Image();im.src=d.photo;im.alt=d.name;
    im.onerror=function(){box.innerHTML=badge({hue:d.hue})};
    box.appendChild(im);
  }else box.innerHTML=badge({hue:d.hue});
  $("d-tags").innerHTML='<span class="d-tag" style="--c:'+gc+'">'+esc(gname(d.group))+'</span>'
    +(mname(d)?'<span class="d-tag" style="--c:'+mcolor(d)+'">'+esc(mname(d))+'</span>':'');
  $("d-name").textContent=d.name;
  $("d-fields").innerHTML=field("發售日期",d.year+" 年 "+d.month+" 月")+field("販售地點",d.place)+(d.currency==="NA"?field("官方售價","-"):d.price?field("官方售價",d.currency==="CNY"?"人民幣 "+Number(d.price).toLocaleString()+" 元":"¥"+Number(d.price).toLocaleString()+"（日圓・含稅）"):"")+field("活動／商品",d.event,true);
  var i=CUR.indexOf(d);
  $("d-pos").textContent=i>=0?(i+1)+" / "+CUR.length:"";
  $("d-prev").disabled=i<=0;$("d-next").disabled=i<0||i>=CUR.length-1;
  var on=MINE.ids.indexOf(id)>=0;$("d-pick").textContent=on?"✓ 已加入我的圖鑑（點一下移除）":"＋ 加入我的圖鑑";$("d-pick").classList.toggle("on",on);
  if(!$("dlg").open)$("dlg").showModal();
}
function navDlg(n){var i=CUR.findIndex(function(d){return d.id===curId})+n;if(i>=0&&i<CUR.length)openDlg(CUR[i].id)}
$("d-prev").onclick=function(){navDlg(-1)};
$("d-pick").onclick=function(){var card=document.querySelector('.item[data-id="'+curId+'"]');togglePick(curId,card);openDlg(curId)};
$("d-next").onclick=function(){navDlg(1)};
document.addEventListener("keydown",function(e){if(!$("dlg").open)return;if(e.key==="ArrowLeft")navDlg(-1);if(e.key==="ArrowRight")navDlg(1)});
$("dlg-close").onclick=function(){$("dlg").close()};
$("help").onclick=function(){
  $("help-title").textContent=DB.helpTitle||Store.helpTitle;
  $("help-body").innerHTML=Store.helpHtml(DB.help!=null?DB.help:Store.helpText);
  $("helpdlg").showModal();
};
$("help-close").onclick=function(){$("helpdlg").close()};
// ===== 到訪人數（使用免費計數服務 Abacus；同一瀏覽器分頁只算一次，本機開啟只讀不加）=====
(function(){
  var API="https://abacus.jasoncameron.dev/",KEY="aemo-0304-hapi/visits",el=$("visits");
  var online=/^https?:$/.test(location.protocol)&&location.hostname.indexOf("github.io")>=0,counted=false;
  try{counted=sessionStorage.getItem("hapi-visited")==="1"}catch(e){}
  var mode=(online&&!counted)?"hit/":"get/";
  fetch(API+mode+KEY).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){
    el.textContent="到訪人數："+Number(j.value||0).toLocaleString();
    if(mode==="hit/")try{sessionStorage.setItem("hapi-visited","1")}catch(e){}
  }).catch(function(){el.textContent="到訪人數：—"});
})();
$("shop").onclick=function(){
  $("shop-title").textContent=DB.shopTitle||Store.shopTitle;
  $("shop-body").innerHTML=Store.helpHtml(DB.shop!=null?DB.shop:Store.shopText);
  $("shopdlg").showModal();
};
$("shop-close").onclick=function(){$("shopdlg").close()};
$("shopdlg").addEventListener("click",function(e){if(e.target===this)this.close()});
$("helpdlg").addEventListener("click",function(e){if(e.target===this)this.close()});
$("dlg").addEventListener("click",function(e){if(e.target===this)this.close()});
$("q").oninput=function(){S.q=this.value;render()};
$("sort").onchange=function(){S.sort=this.value;render()};
$("reset").onclick=function(){S.q="";S.group=null;S.member=null;S.year={};S.place={};S.chars={};$("q").value="";buildFilters();buildChips();render()};
$("theme").onclick=function(){
  var root=document.documentElement,dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme",dark?"light":"dark");this.textContent=dark?"🌙":"☀️";
};
// ===== 匯出圖鑑 PNG（可依樂團／人物／活動挑選，或用卡片上的「＋」勾選；設定記在訪客自己的瀏覽器）=====
var MKEY="hapi-mine-v1";
var MINE=(function(){var m=null;try{m=JSON.parse(localStorage.getItem(MKEY)||"null")}catch(e){}
  m=m||{};m.ids=(m.ids||[]).filter(function(id){return DATA.some(function(d){return d.id===id})});m.notes=m.notes||{};return m})();
function saveMine(){try{localStorage.setItem(MKEY,JSON.stringify(MINE))}catch(e){}updateExportBtn()}
function updateExportBtn(){$("export").textContent="⬇ 匯出圖鑑"+(MINE.ids.length?"（已勾 "+MINE.ids.length+"）":"")}
function togglePick(id,card){
  var i=MINE.ids.indexOf(id);if(i>=0)MINE.ids.splice(i,1);else MINE.ids.push(id);
  var on=i<0;if(card){card.classList.toggle("picked",on);var p=card.querySelector(".pick");if(p)p.setAttribute("aria-checked",on)}
  saveMine();
}
function sortList(list){return list.sort(function(a,b){return S.sort==="new"?b.date-a.date:S.sort==="old"?a.date-b.date:a.name.localeCompare(b.name,"zh-Hant")})}
function memberLabel(g,mid){if(mid==="all")return g.name+"全團";var m=(g.members||[]).filter(function(m){return m.id===mid})[0];return m?m.name:""}
function opt(v,t,sel){return '<option value="'+esc(v)+'"'+(sel?" selected":"")+'>'+esc(t)+'</option>'}
// 依目前選的樂團，更新「人物」選單
function fillMembersSel(cur){
  var gid=$("ex-g").value,h=opt("","全部人物",!cur);
  GROUPS.forEach(function(g){
    if(gid&&g.id!==gid)return;if(!g.members||!g.members.length)return;
    [{id:"all"}].concat(g.members).forEach(function(m){
      var v=g.id+":"+m.id,n=DATA.filter(function(d){return d.group===g.id&&d.member===m.id}).length;
      if(n)h+=opt(v,memberLabel(g,m.id)+(gid?"":"（"+g.name+"）")+"　"+n+" 件",v===cur);
    });
  });
  $("ex-m").innerHTML=h;$("ex-m").disabled=$("ex-m").options.length<2;
}
function fillEventsSel(cur){
  var gid=$("ex-g").value,mv=$("ex-m").value,c={};
  DATA.forEach(function(d){if(gid&&d.group!==gid)return;if(mv&&d.group+":"+d.member!==mv)return;if(d.event)c[d.event]=(c[d.event]||0)+1});
  var h=opt("","全部活動",!cur);

function loadImg(src,cors){return new Promise(function(res){
  var im=new Image(),done=false;if(cors)im.crossOrigin="anonymous";
  var t=setTimeout(function(){if(!done){done=true;res(null)}},15000);
  im.onload=function(){if(!done){done=true;clearTimeout(t);res(im)}};
  im.onerror=function(){if(!done){done=true;clearTimeout(t);res(null)}};
  im.src=src;
})}
// 確認圖片能放進畫布（跨網站圖片若對方不允許，PNG 會無法存檔）
function safeImg(im){try{var c=document.createElement("canvas");c.width=c.height=2;var x=c.getContext("2d");x.drawImage(im,0,0,2,2);x.getImageData(0,0,1,1);return true}catch(e){return false}}
function getImg(d){
  if(!d.photo)return Promise.resolve(null);
  var local=!/^https?:/i.test(d.photo)||d.photo.indexOf(location.origin)===0;
  return loadImg(d.photo,!local).then(function(im){
    if(im&&safeImg(im))return im;
    if(local)return null;
    return loadImg("https://wsrv.nl/?url="+encodeURIComponent(d.photo)+"&w=400&h=400&fit=inside",true).then(function(i2){return i2&&safeImg(i2)?i2:null});
  });
}
var COAT=new Path2D("M10 22L38 14L50 24L62 14L90 22L98 52L80 56L78 90L22 90L20 56L2 52Z"),COATL=new Path2D("M38 14L50 26L50 90L44 90L44 30L34 16Z"),COATR=new Path2D("M62 14L50 26L50 90L56 90L56 30L66 16Z");
function drawCoat(x,cx,cy,size,hue){
  x.save();x.translate(cx-size/2,cy-size/2);x.scale(size/100,size/100);
  x.fillStyle="hsl("+hue+",70%,42%)";x.fill(COAT);x.strokeStyle="rgba(0,0,0,.2)";x.stroke(COAT);x.fillStyle="#fff";x.fill(COATL);x.fill(COATR);x.restore();
}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function wrap(x,text,maxW,maxLines){

  return lines;
}
function priceText(d){
  if(d.currency==="NA")return "-";
  if(!d.price)return "";
  return d.currency==="CNY"?"人民幣 "+Number(d.price).toLocaleString()+" 元":"¥"+Number(d.price).toLocaleString();
}
// 三角旗：沿一條下垂的繩子排小旗子
function bunting(x,x0,y0,x1,y1,n){
  var cols=["#ff9cc8","#8fd3f4","#ffd166","#a8e6a1","#c9a7ff"];
  var mx=(x0+x1)/2,my=Math.max(y0,y1)+26;
  x.strokeStyle="#6b5a4e";x.lineWidth=1.5;x.beginPath();x.moveTo(x0,y0);x.quadraticCurveTo(mx,my,x1,y1);x.stroke();
  for(var i=0;i<n;i++){
    var t=(i+.5)/n,px=(1-t)*(1-t)*x0+2*(1-t)*t*mx+t*t*x1,py=(1-t)*(1-t)*y0+2*(1-t)*t*my+t*t*y1;
    var dx=2*(1-t)*(mx-x0)+2*t*(x1-mx),dy=2*(1-t)*(my-y0)+2*t*(y1-my),len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,w=11;
    x.fillStyle=cols[i%cols.length];x.beginPath();x.moveTo(px-ux*w,py-uy*w);x.lineTo(px+ux*w,py+uy*w);x.lineTo(px-uy*22,py+ux*22);x.closePath();x.fill();
  }
}
async function doExport(){

  $("ex-go").disabled=true;
  var FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';

    return getImg(d).then(function(im){if(im)imgs[d.id]=im;else bad++;$("ex-msg").textContent="載入照片中… "+(++done)+" / "+withPhoto});
  }));

  $("ex-msg").textContent="產生圖片中…";
  var hasPrice=showPrice&&list.some(function(d){return priceText(d)}),hasNote=list.some(function(d){return MINE.notes[d.id]});
  var SC=2,FR=26,IN=30,CW=180,IMG=158,GX=14,GY=24,NAME=36,PR=hasPrice?22:0,NT=hasNote?20:0,CH=IMG+10+NAME+PR+NT,LOGO_H=bandLogo?78:0,HEAD=210+LOGO_H,FOOT=56;
  var gridW=cols*CW+(cols-1)*GX,W=Math.max(FR*2+IN*2+gridW,620);

    var H=FR*2+HEAD+r*CH+(r-1)*GY+FOOT;
    var c=document.createElement("canvas");c.width=W*SC;c.height=H*SC;var x=c.getContext("2d");x.scale(SC,SC);x.textBaseline="top";
    x.fillStyle=color;x.fillRect(0,0,W,H);
    rr(x,FR,FR,W-FR*2,H-FR*2,18);x.fillStyle="#fffdf6";x.fill();
    bunting(x,FR,FR+6,FR+Math.min(220,W*.26),FR+56,6);
    bunting(x,W-FR-Math.min(220,W*.26),FR+56,W-FR,FR+6,6);
    x.font="bold 34px "+FONT;var tw=Math.min(W-FR*2-200,Math.max(280,x.measureText(title).width+70)),tx=(W-tw)/2,ty=FR+26,th=66;
    rr(x,tx+4,ty+4,tw,th,10);x.fillStyle=color;x.fill();
    rr(x,tx,ty,tw,th,10);x.fillStyle="#fff";x.fill();x.strokeStyle=ink;x.lineWidth=2.5;x.stroke();
    x.fillStyle=ink;x.textAlign="center";x.fillText(wrap(x,title+(pages>1?"（"+(p+1)+"/"+pages+"）":""),tw-30,1)[0],W/2,ty+15);
    if(bandLogo){var lmw=Math.min(380,W-FR*2-80),ls=Math.min(lmw/bandLogo.width,LOGO_H/bandLogo.height),lw=bandLogo.width*ls,lh=bandLogo.height*ls;
      x.drawImage(bandLogo,(W-lw)/2,ty+th+14+(LOGO_H-lh)/2,lw,lh)}
    if(sub){x.font="bold 18px "+FONT;x.fillStyle="#e8498c";x.fillText(wrap(x,sub,W-FR*2-60,1)[0],W/2,ty+th+14+LOGO_H+(bandLogo?8:0))}
    x.textAlign="left";x.font="13px "+FONT;x.fillStyle=soft;var iy=FR+HEAD-46;

    x.strokeStyle="#eadfce";x.lineWidth=1;x.beginPath();x.moveTo(FR+IN,FR+HEAD-8);x.lineTo(W-FR-IN,FR+HEAD-8);x.stroke();

      if(MINE.notes[d.id]){x.font="bold 13px "+FONT;x.fillStyle="#e8498c";x.fillText(wrap(x,MINE.notes[d.id],CW-6,1)[0],cx+CW/2,y)}

    var a=document.createElement("a");a.href=URL.createObjectURL(blob);

    document.body.appendChild(a);a.click();a.remove();(function(u){setTimeout(function(){URL.revokeObjectURL(u)},5000)})(a.href);

  $("ex-go").disabled=false;
}
